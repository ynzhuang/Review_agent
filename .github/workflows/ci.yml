name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # TypeScript: the 70-package npm workspace — types, unit tests, client build.
  # ---------------------------------------------------------------------
  typescript:
    name: TypeScript (typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # Typecheck spans every workspace package at once; the heap bump is
      # required for a project this size (see package.json "typecheck").
      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

      - name: Build client bundle
        run: npm run build:client

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: dist/client
          retention-days: 7

  # ---------------------------------------------------------------------
  # Python: the deepagents agent sidecar.
  # ---------------------------------------------------------------------
  python:
    name: Python sidecar (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install sidecar + test extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        working-directory: python
        run: pytest -q

  # ---------------------------------------------------------------------
  # Container: prove the single portable image still builds and boots.
  # This is the artifact the platform actually deploys with.
  # ---------------------------------------------------------------------
  docker:
    name: Docker image (build · healthcheck)
    runs-on: ubuntu-latest
    # A cold build installs the full langchain/deepagents tree into the
    # image and can run long on a contended runner. Warm builds reuse the
    # cached sidecar layer and finish in a few minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chart-review:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image against an empty data volume and wait for the
      # server's own /api/v2/healthz to go green — the same endpoint the
      # image's HEALTHCHECK uses. No model backend is configured, so this
      # asserts the server serves, not that the agent runs.
      - name: Boot container and wait for healthz
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name chart-review-ci \
            -p 3002:3002 \
            -v "$RUNNER_TEMP/data:/data" \
            chart-review:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3002/api/v2/healthz >/dev/null 2>&1; then
              echo "healthz green after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs chart-review-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs chart-review-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f chart-review-ci || true
