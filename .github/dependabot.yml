version: 2

# Majors are deliberate upgrades, not background churn: a Node base-image
# or runner-action major can change the build out from under CI. Every
# ecosystem below ignores major bumps and groups the rest, so Dependabot
# produces a few reviewable PRs a month instead of a wall of them.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  # The image pins node:20-bookworm because the platform targets Node 20.
  # Only patch/minor moves within that line are automatic.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]
